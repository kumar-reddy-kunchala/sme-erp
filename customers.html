<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - ERP System</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/framework.css">
    <link rel="stylesheet" href="css/master.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500&display=swap" rel="stylesheet">
    <style>
        .sidebar { transition: all 0.3s ease; position: relative; z-index: 100; }
        .sidebar.collapsed { margin-left: -250px; width: 250px; }
        .page.sidebar-collapsed .sidebar { margin-left: -250px; }
        .toggle-sidebar { background: none; border: none; cursor: pointer; font-size: 20px; color: #333; padding: 10px; }
        .toggle-sidebar:hover { background-color: #f0f0f0; border-radius: 5px; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background-color: #fefefe; padding: 30px; border: none; border-radius: 10px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .modal-content button { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .modal-content button:hover { background-color: #2980b9; }
        .history-item { background-color: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 5px; font-size: 14px; }
    </style>
    <script>
        // Check if user is logged in
        if (localStorage.getItem('user_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
        // Check if session expired
        const expiryTime = localStorage.getItem('expiry_time');
        if (expiryTime && new Date().getTime() > parseInt(expiryTime)) {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
<body>
    <div class="page d-flex">
        <!-- Start Sidebar -->
        <div class="sidebar bg-white p-20 p-relative">
            <h3 class="p-relative txt-c mt-0">ERP System</h3>
            <ul>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="index.html">
                        <i class="fa-regular fa-chart-bar fa-fw"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="products.html">
                        <i class="fa-solid fa-box fa-fw"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li>
                    <a class="active d-flex align-center fs-14 c-black rad-6 p-10" href="customers.html">
                        <i class="fa-solid fa-users fa-fw"></i>
                        <span>Customers</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="sales.html">
                        <i class="fa-solid fa-receipt fa-fw"></i>
                        <span>Sales/Invoices</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="inventory.html">
                        <i class="fa-solid fa-warehouse fa-fw"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="reports.html">
                        <i class="fa-solid fa-chart-line fa-fw"></i>
                        <span>Reports</span>
                    </a>
                </li>
            </ul>
        </div>
        <!-- End Sidebar -->
        <div class="content w-full overflow-hidden">
            <!-- Start Head -->
            <div class="head bg-white p-15 between-flex">
                <div class="d-flex align-center gap-20">
                    <button class="toggle-sidebar" id="sidebarToggle" title="Toggle Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="search p-relative">
                        <input class="p-10 main-border rad-10" type="search" id="customerSearch" placeholder="Search customers...">
                    </div>
                </div>
                <div class="icons d-flex align-center gap-15">
                    <span style="font-size: 13px; color: #666; font-weight: 500;">Welcome, <strong id="usernameDisplay">User</strong></span>
                    <span class="notification p-relative">
                        <i class="fa-regular fa-bell fa-lg"></i>
                    </span>
                    <img src="imgs/avatar.png" alt="" style="cursor: pointer;">
                    <button id="logoutBtn" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px;">
                        <i class="fa-solid fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            <!-- End Head -->
            <h1 class="p-relative">Customers</h1>
            <div class="p-20 bg-white rad-10 m-20">
                <div class="between-flex mb-20">
                    <h2 class="mt-0">Customer Directory</h2>
                    <button class="bg-blue c-white p-10 b-none rad-6 fs-14 btn-add" id="addCustomerBtn">
                        <i class="fa-solid fa-plus"></i> Add Customer
                    </button>
                </div>
                
                <div class="mb-20">
                    <input type="text" id="customerSearch" placeholder="Search customers by name, email, or phone..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;">
                </div>
                
                <div class="responsive-table">
                    <table class="fs-15 w-full" id="customerTable" style="border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #2c3e50; color: white; font-weight: 600; text-align: left;">
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Customer ID</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Name</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Email</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Phone</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Address</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Total Purchase</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Action</td>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <!-- Customers will be populated here -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex align-center gap-20 mt-20 txt-c">
                    <button class="bg-blue c-white p-10 b-none rad-6 fs-14" id="prevBtn">Previous</button>
                    <span id="pageInfo">Page 1 of 1</span>
                    <button class="bg-blue c-white p-10 b-none rad-6 fs-14" id="nextBtn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Customer Modal -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Add Customer</h2>
            <input type="hidden" id="customerId">
            <input type="text" id="customerName" placeholder="Full Name">
            <input type="email" id="customerEmail" placeholder="Email Address">
            <input type="tel" id="customerPhone" placeholder="Phone Number">
            <textarea id="customerAddress" placeholder="Address" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; min-height: 80px;"></textarea>
            <button id="saveCustomerBtn">Save Customer</button>
        </div>
    </div>

    <!-- View Purchase History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeHistoryModal">&times;</span>
            <h2>Purchase History - <span id="historyCustomerName"></span></h2>
            <div id="purchaseHistory"></div>
        </div>
    </div>

    <script>
        let customers = [
            { id: 'C001', name: 'John Smith', email: 'john@example.com', phone: '9876543210', address: '123 Main St, City', totalPurchase: 25000, purchases: [{ date: '2026-02-10', amount: 5000 }, { date: '2026-02-05', amount: 8000 }, { date: '2026-01-28', amount: 12000 }] },
            { id: 'C002', name: 'Sarah Johnson', email: 'sarah@example.com', phone: '9876543211', address: '456 Oak Ave, Town', totalPurchase: 18000, purchases: [{ date: '2026-02-08', amount: 6000 }, { date: '2026-01-30', amount: 12000 }] },
            { id: 'C003', name: 'Mike Davis', email: 'mike@example.com', phone: '9876543212', address: '789 Pine Rd, Village', totalPurchase: 32000, purchases: [{ date: '2026-02-09', amount: 10000 }, { date: '2026-02-01', amount: 12000 }, { date: '2026-01-20', amount: 10000 }] },
            { id: 'C004', name: 'Emily Wilson', email: 'emily@example.com', phone: '9876543213', address: '321 Elm St, County', totalPurchase: 15500, purchases: [{ date: '2026-02-07', amount: 7500 }, { date: '2026-02-01', amount: 8000 }] },
            { id: 'C005', name: 'Robert Brown', email: 'robert@example.com', phone: '9876543214', address: '654 Maple Dr, Borough', totalPurchase: 42000, purchases: [{ date: '2026-02-11', amount: 15000 }, { date: '2026-02-03', amount: 14000 }, { date: '2026-01-25', amount: 13000 }] },
            { id: 'C006', name: 'Jennifer Martinez', email: 'jennifer@example.com', phone: '9876543215', address: '987 Cedar Ln, Parish', totalPurchase: 22000, purchases: [{ date: '2026-02-06', amount: 9000 }, { date: '2026-02-02', amount: 13000 }] }
        ];

        let currentPage = 1;
        const itemsPerPage = 5;
        let filteredCustomers = [...customers];

        const modal = document.getElementById('customerModal');
        const historyModal = document.getElementById('historyModal');
        const addBtn = document.getElementById('addCustomerBtn');
        const closeBtn = document.getElementById('closeModal');
        const closeHistoryBtn = document.getElementById('closeHistoryModal');
        const searchBox = document.getElementById('customerSearch');

        addBtn.onclick = () => {
            document.getElementById('customerId').value = '';
            document.getElementById('customerName').value = '';
            document.getElementById('customerEmail').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerAddress').value = '';
            document.querySelector('.modal-content h2').textContent = 'Add Customer';
            modal.classList.add('active');
        };

        closeBtn.onclick = () => modal.classList.remove('active');
        closeHistoryBtn.onclick = () => historyModal.classList.remove('active');
        
        window.onclick = (e) => {
            if (e.target === modal) modal.classList.remove('active');
            if (e.target === historyModal) historyModal.classList.remove('active');
        };

        document.getElementById('saveCustomerBtn').onclick = () => {
            const id = document.getElementById('customerId').value;
            const name = document.getElementById('customerName').value;
            const email = document.getElementById('customerEmail').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;

            if (!name || !email || !phone || !address) {
                alert('Please fill all fields');
                return;
            }

            if (id) {
                const customer = customers.find(c => c.id === id);
                customer.name = name;
                customer.email = email;
                customer.phone = phone;
                customer.address = address;
            } else {
                const newId = 'C' + String(customers.length + 1).padStart(3, '0');
                customers.push({
                    id: newId,
                    name,
                    email,
                    phone,
                    address,
                    totalPurchase: 0,
                    purchases: []
                });
            }

            modal.classList.remove('active');
            filteredCustomers = [...customers];
            currentPage = 1;
            displayCustomers();
        };

        function filterCustomers() {
            const searchTerm = searchBox.value.toLowerCase();
            if (searchTerm === '') {
                filteredCustomers = [...customers];
            } else {
                filteredCustomers = customers.filter(c =>
                    c.name.toLowerCase().includes(searchTerm) ||
                    c.id.toLowerCase().includes(searchTerm) ||
                    c.email.toLowerCase().includes(searchTerm) ||
                    c.phone.includes(searchTerm)
                );
            }
            currentPage = 1;
            displayCustomers();
        }

        function displayCustomers() {
            const tbody = document.getElementById('customerTableBody');
            tbody.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageCustomers = filteredCustomers.slice(start, end);

            pageCustomers.forEach((customer, index) => {
                const row = tbody.insertRow();
                row.style.backgroundColor = index % 2 === 0 ? '#ffffff' : '#f8f9fa';
                row.style.borderLeft = '4px solid #3498db';
                row.innerHTML = `
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7; font-weight: 500;">${customer.id}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${customer.name}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${customer.email}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${customer.phone}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${customer.address}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7; font-weight: 500;">₹${customer.totalPurchase.toFixed(2)}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">
                        <button class="bg-blue c-white p-5 b-none rad-6 fs-13" onclick="editCustomer('${customer.id}')">Edit</button>
                        <button class="bg-green c-white p-5 b-none rad-6 fs-13" onclick="viewHistory('${customer.id}')" style="margin-left: 5px;">History</button>
                    </td>
                `;
            });

            const totalPages = Math.ceil(filteredCustomers.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function editCustomer(id) {
            const customer = customers.find(c => c.id === id);
            document.getElementById('customerId').value = customer.id;
            document.getElementById('customerName').value = customer.name;
            document.getElementById('customerEmail').value = customer.email;
            document.getElementById('customerPhone').value = customer.phone;
            document.getElementById('customerAddress').value = customer.address;
            document.querySelector('.modal-content h2').textContent = 'Edit Customer';
            modal.classList.add('active');
        }

        function viewHistory(id) {
            const customer = customers.find(c => c.id === id);
            document.getElementById('historyCustomerName').textContent = customer.name;
            const historyDiv = document.getElementById('purchaseHistory');
            historyDiv.innerHTML = '';

            if (customer.purchases.length > 0) {
                customer.purchases.forEach(purchase => {
                    historyDiv.innerHTML += `<div class="history-item"><strong>${purchase.date}</strong> - Amount: <strong>₹${purchase.amount.toFixed(2)}</strong></div>`;
                });
            } else {
                historyDiv.innerHTML = '<p class="c-grey">No purchase history</p>';
            }

            historyModal.classList.add('active');
        }

        document.getElementById('prevBtn').onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                displayCustomers();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            const totalPages = Math.ceil(filteredCustomers.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayCustomers();
            }
        };

        searchBox.addEventListener('input', filterCustomers);

        displayCustomers();

        // Display username
        const username = localStorage.getItem('username') || 'User';
        document.getElementById('usernameDisplay').textContent = username;

        // Logout functionality
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            window.location.href = 'login.html';
        };

        // Collapsible Sidebar
        const sidebarToggle = document.getElementById('sidebarToggle');
        const page = document.querySelector('.page');
        const sidebar = document.querySelector('.sidebar');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            page.classList.toggle('sidebar-collapsed');
        });
    </script>
</body>
</html>
