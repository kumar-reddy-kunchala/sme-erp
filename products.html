<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - ERP System</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/framework.css">
    <link rel="stylesheet" href="css/master.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500&display=swap" rel="stylesheet">
    <style>
        .sidebar { transition: all 0.3s ease; position: relative; z-index: 100; }
        .sidebar.collapsed { margin-left: -250px; width: 250px; }
        .page.sidebar-collapsed .sidebar { margin-left: -250px; }
        .toggle-sidebar { background: none; border: none; cursor: pointer; font-size: 20px; color: #333; padding: 10px; }
        .toggle-sidebar:hover { background-color: #f0f0f0; border-radius: 5px; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background-color: #fefefe; padding: 30px; border: none; border-radius: 10px; width: 90%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .modal-content button { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .modal-content button:hover { background-color: #2980b9; }
        .low-stock { background-color: #ffebee; }
        .badge-danger { background-color: #e74c3c; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-success { background-color: #27ae60; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-warning { background-color: #f39c12; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
    </style>
    <script>
        // Check if user is logged in
        if (localStorage.getItem('user_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
        // Check if session expired
        const expiryTime = localStorage.getItem('expiry_time');
        if (expiryTime && new Date().getTime() > parseInt(expiryTime)) {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
<body>
    <div class="page d-flex">
        <!-- Start Sidebar -->
        <div class="sidebar bg-white p-20 p-relative">
            <h3 class="p-relative txt-c mt-0">ERP System</h3>
            <ul>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="index.html">
                        <i class="fa-regular fa-chart-bar fa-fw"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a class="active d-flex align-center fs-14 c-black rad-6 p-10" href="products.html">
                        <i class="fa-solid fa-box fa-fw"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="customers.html">
                        <i class="fa-solid fa-users fa-fw"></i>
                        <span>Customers</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="sales.html">
                        <i class="fa-solid fa-receipt fa-fw"></i>
                        <span>Sales/Invoices</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="inventory.html">
                        <i class="fa-solid fa-warehouse fa-fw"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="reports.html">
                        <i class="fa-solid fa-chart-line fa-fw"></i>
                        <span>Reports</span>
                    </a>
                </li>
            </ul>
        </div>
        <!-- End Sidebar -->
        <div class="content w-full overflow-hidden">
            <!-- Start Head -->
            <div class="head bg-white p-15 between-flex">
                <div class="d-flex align-center gap-20">
                    <button class="toggle-sidebar" id="sidebarToggle" title="Toggle Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="search p-relative">
                        <input class="p-10 main-border rad-10" type="search" id="productSearch" placeholder="Search products...">
                    </div>
                </div>
                <div class="icons d-flex align-center gap-15">
                    <span style="font-size: 13px; color: #666; font-weight: 500;">Welcome, <strong id="usernameDisplay">User</strong></span>
                    <span class="notification p-relative">
                        <i class="fa-regular fa-bell fa-lg"></i>
                    </span>
                    <img src="imgs/avatar.png" alt="" style="cursor: pointer;">
                    <button id="logoutBtn" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px;">
                        <i class="fa-solid fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            <!-- End Head -->
            <h1 class="p-relative">Products</h1>
            <div class="p-20 bg-white rad-10 m-20">
                <div class="between-flex mb-20">
                    <h2 class="mt-0">Product Inventory</h2>
                    <button class="bg-blue c-white p-10 b-none rad-6 fs-14 btn-add" id="addProductBtn">
                        <i class="fa-solid fa-plus"></i> Add Product
                    </button>
                </div>
                
                <div class="mb-20">
                    <input type="text" id="productSearch" placeholder="Search products by name, ID, or category..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;">
                </div>
                
                <div class="responsive-table">
                    <table class="fs-15 w-full" id="productTable" style="border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #2c3e50; color: white; font-weight: 600; text-align: left;">
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Product ID</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Name</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Category</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Price</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Stock</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Status</td>
                                <td style="padding: 15px; border: 1px solid #bdc3c7;">Action</td>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <!-- Products will be populated here -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex align-center gap-20 mt-20 txt-c">
                    <button class="bg-blue c-white p-10 b-none rad-6 fs-14" id="prevBtn">Previous</button>
                    <span id="pageInfo">Page 1 of 1</span>
                    <button class="bg-blue c-white p-10 b-none rad-6 fs-14" id="nextBtn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Add Product</h2>
            <input type="hidden" id="productId">
            <input type="text" id="productName" placeholder="Product Name">
            <select id="productCategory">
                <option value="">Select Category</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Food">Food</option>
                <option value="Books">Books</option>
                <option value="Other">Other</option>
            </select>
            <input type="number" id="productPrice" placeholder="Price" step="0.01">
            <input type="number" id="productStock" placeholder="Stock Quantity">
            <button id="saveProductBtn">Save Product</button>
        </div>
    </div>

    <script>
        let products = [
            { id: 'P001', name: 'Laptop', category: 'Electronics', price: 45000, stock: 12, status: 'available' },
            { id: 'P002', name: 'Wireless Mouse', category: 'Electronics', price: 1200, stock: 3, status: 'low' },
            { id: 'P003', name: 'USB Cable', category: 'Electronics', price: 299, stock: 0, status: 'outofstock' },
            { id: 'P004', name: 'T-Shirt', category: 'Clothing', price: 599, stock: 45, status: 'available' },
            { id: 'P005', name: 'Jeans', category: 'Clothing', price: 1499, stock: 8, status: 'low' },
            { id: 'P006', name: 'Coffee Beans', category: 'Food', price: 450, stock: 28, status: 'available' },
            { id: 'P007', name: 'Organic Tea', category: 'Food', price: 350, stock: 4, status: 'low' },
            { id: 'P008', name: 'JavaScript Book', category: 'Books', price: 599, stock: 15, status: 'available' },
            { id: 'P009', name: 'Python Guide', category: 'Books', price: 549, stock: 2, status: 'low' },
            { id: 'P010', name: 'Notebook', category: 'Other', price: 199, stock: 60, status: 'available' }
        ];

        let currentPage = 1;
        const itemsPerPage = 5;
        let filteredProducts = [...products];

        const modal = document.getElementById('productModal');
        const addBtn = document.getElementById('addProductBtn');
        const closeBtn = document.getElementById('closeModal');
        const searchBox = document.getElementById('productSearch');

        addBtn.onclick = () => {
            document.getElementById('productId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productCategory').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productStock').value = '';
            document.querySelector('.modal-content h2').textContent = 'Add Product';
            modal.classList.add('active');
        };

        closeBtn.onclick = () => modal.classList.remove('active');
        window.onclick = (e) => {
            if (e.target === modal) modal.classList.remove('active');
        };

        document.getElementById('saveProductBtn').onclick = () => {
            const id = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);

            if (!name || !category || !price || isNaN(stock)) {
                alert('Please fill all fields');
                return;
            }

            if (id) {
                const product = products.find(p => p.id === id);
                product.name = name;
                product.category = category;
                product.price = price;
                product.stock = stock;
                product.status = stock > 5 ? 'available' : stock > 0 ? 'low' : 'outofstock';
            } else {
                const newId = 'P' + String(products.length + 1).padStart(3, '0');
                products.push({
                    id: newId,
                    name,
                    category,
                    price,
                    stock,
                    status: stock > 5 ? 'available' : stock > 0 ? 'low' : 'outofstock'
                });
            }

            modal.classList.remove('active');
            filteredProducts = [...products];
            currentPage = 1;
            displayProducts();
        };

        function getStatusBadge(status) {
            if (status === 'low') return '<span class="badge-warning">Low Stock</span>';
            if (status === 'outofstock') return '<span class="badge-danger">Out of Stock</span>';
            return '<span class="badge-success">Available</span>';
        }

        function filterProducts() {
            const searchTerm = searchBox.value.toLowerCase();
            if (searchTerm === '') {
                filteredProducts = [...products];
            } else {
                filteredProducts = products.filter(p =>
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.id.toLowerCase().includes(searchTerm) ||
                    p.category.toLowerCase().includes(searchTerm)
                );
            }
            currentPage = 1;
            displayProducts();
        }

        function displayProducts() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageProducts = filteredProducts.slice(start, end);

            pageProducts.forEach((product, index) => {
                const row = tbody.insertRow();
                row.style.backgroundColor = index % 2 === 0 ? '#ffffff' : '#f8f9fa';
                row.style.borderLeft = product.status === 'low' ? '4px solid #f39c12' : product.status === 'outofstock' ? '4px solid #e74c3c' : '4px solid #27ae60';
                row.innerHTML = `
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7; font-weight: 500;">${product.id}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${product.name}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${product.category}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7; font-weight: 500;">₹${product.price.toFixed(2)}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7; text-align: center;">${product.stock}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">${getStatusBadge(product.status)}</td>
                    <td style="padding: 12px 15px; border: 1px solid #bdc3c7;">
                        <button class="bg-blue c-white p-5 b-none rad-6 fs-13" onclick="editProduct('${product.id}')">Edit</button>
                    </td>
                `;
            });

            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productStock').value = product.stock;
            document.querySelector('.modal-content h2').textContent = 'Edit Product';
            modal.classList.add('active');
        }

        document.getElementById('prevBtn').onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                displayProducts();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayProducts();
            }
        };

        searchBox.addEventListener('input', filterProducts);

        displayProducts();

        // Display username
        const username = localStorage.getItem('username') || 'User';
        document.getElementById('usernameDisplay').textContent = username;

        // Logout functionality
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            window.location.href = 'login.html';
        };

        // Collapsible Sidebar
        const sidebarToggle = document.getElementById('sidebarToggle');
        const page = document.querySelector('.page');
        const sidebar = document.querySelector('.sidebar');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            page.classList.toggle('sidebar-collapsed');
        });
    </script>
</body>
</html>
